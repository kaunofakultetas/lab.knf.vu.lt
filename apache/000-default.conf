ServerName lab.knf.vu.lt

# Name no versions: "Server: Apache" alone, and no signature under
# Apache's own error pages (Debian's security.conf, read earlier,
# sets OS and On)
ServerTokens Prod
ServerSignature Off

# Take the real client IP from X-Forwarded-For, but only when the
# request arrives from the internal Caddy endpoint container
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.0.0.0/8

<VirtualHost *:8080>
	ServerAdmin admin@knf.vu.lt
	ServerName lab.knf.vu.lt
	DocumentRoot /var/www/html/public/

	ErrorLog /var/www/logs/error.log
	LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
	CustomLog /var/www/logs/access.log proxy
</VirtualHost>

<Directory /var/www/html >
	Options -Indexes +FollowSymLinks -MultiViews
	AllowOverride All
	Require all granted
</Directory>
<Directory /var/www/html/storage/app/public >
	php_flag engine off
	<FilesMatch "\.(?:php[0-9]?|phtml|phar|shtml)$">
		Require all denied
	</FilesMatch>
</Directory>

# The same lockdown for the path requests take to that folder: Apache
# matches Directory sections against the path it walks, public/upload,
# never the symlink's target above
<Directory /var/www/html/public/upload >
	php_flag engine off
	<FilesMatch "\.(?:php[0-9]?|phtml|phar|shtml)$">
		Require all denied
	</FilesMatch>
</Directory>

# The challenge files the admins copy into _DATA/apache/downloads, which
# docker-compose.yml mounts at public/downloads, are files to download:
# a script among them — a web challenge's source, handed out to be read
# — must never run as the app, whose environment holds the database
# password and APP_KEY. Locked down like the upload folder, and an
# .htaccess there is not read, so none can switch PHP back on. A page
# or an image that can carry scripts — HTML, SVG, XML, a phishing
# sample, say — goes out as a file to save, any case, whatever comes
# after its extension, never opened as a page of the lab's own site,
# where its scripts would run with a signed-in player's session
<Directory /var/www/html/public/downloads >
	AllowOverride None
	php_flag engine off
	<FilesMatch "\.(?:php[0-9]?|phtml|phar|shtml)$">
		Require all denied
	</FilesMatch>
	<FilesMatch "(?i)\.(?:x?html?|xht|svgz?|xml|xslt?)(?:\.|$)">
		ForceType application/octet-stream
	</FilesMatch>
</Directory>
