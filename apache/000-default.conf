ServerName lab.knf.vu.lt

# Name no versions: "Server: Apache" alone, and no signature under
# Apache's own error pages (Debian's security.conf, read earlier,
# sets OS and On)
ServerTokens Prod
ServerSignature Off

# Take the real client IP from X-Forwarded-For, but only when the
# request arrives from the internal Caddy endpoint container
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.0.0.0/8

<VirtualHost *:8080>
	ServerAdmin admin@knf.vu.lt
	ServerName lab.knf.vu.lt
	DocumentRoot /var/www/html/public/

	ErrorLog /var/www/logs/error.log
	LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
	CustomLog /var/www/logs/access.log proxy
</VirtualHost>

<Directory /var/www/html >
	Options -Indexes +FollowSymLinks -MultiViews
	AllowOverride All
	Require all granted
</Directory>
<Directory /var/www/html/storage/app/public >
	php_flag engine off
	<FilesMatch "\.(?:php[0-9]?|phtml|phar|shtml)$">
		Require all denied
	</FilesMatch>
</Directory>

# The same lockdown for the path requests take to that folder: Apache
# matches Directory sections against the path it walks, public/upload,
# never the symlink's target above
<Directory /var/www/html/public/upload >
	php_flag engine off
	<FilesMatch "\.(?:php[0-9]?|phtml|phar|shtml)$">
		Require all denied
	</FilesMatch>
</Directory>
